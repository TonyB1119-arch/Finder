name: build-windows
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p finder --release
      - uses: actions/upload-artifact@v4
        with:
          name: finder-windows
          path: |
            target/release/*.exe
